<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReputationFlow</title>
  <link rel="stylesheet" href="../styles/popup.css">
</head>
<body>
  <div id="app">
    <!-- Login View -->
    <div id="login-view" class="view">
      <div class="header">
        <div class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="24" height="24" rx="6" fill="#2563eb"/>
            <path d="M12 4L14.5 9.5L20 10.5L16 14.5L17 20L12 17L7 20L8 14.5L4 10.5L9.5 9.5L12 4Z" fill="white"/>
          </svg>
          <span>ReputationFlow</span>
        </div>
      </div>

      <div class="content">
        <h2>Sign in to your account</h2>
        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
          </div>
          <div id="login-error" class="error-msg" style="display: none;"></div>
          <button type="submit" class="btn-primary" id="login-btn">Sign In</button>
        </form>
      </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-view" class="view" style="display: none;">
      <div class="header">
        <div class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="24" height="24" rx="6" fill="#2563eb"/>
            <path d="M12 4L14.5 9.5L20 10.5L16 14.5L17 20L12 17L7 20L8 14.5L4 10.5L9.5 9.5L12 4Z" fill="white"/>
          </svg>
          <span>ReputationFlow</span>
        </div>
        <button id="logout-btn" class="btn-icon" title="Log out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>

      <div class="content">
        <!-- Quick Stats -->
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-value" id="total-reviews">--</span>
            <span class="stat-label">Total Reviews</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="avg-rating">--</span>
            <span class="stat-label">Avg Rating</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="total-businesses">--</span>
            <span class="stat-label">Businesses</span>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="section">
          <h3>Quick Actions</h3>
          <div class="actions-list">
            <button class="action-btn" id="btn-review-request">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
              Send Review Request
            </button>
            <a href="http://localhost:3000/dashboard" target="_blank" class="action-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
              Open Dashboard
            </a>
          </div>
        </div>

        <!-- Review Request Form -->
        <div id="review-request-form" class="section" style="display: none;">
          <h3>Send Review Request</h3>
          <form id="request-form">
            <div class="form-group">
              <label for="customer-name">Customer Name</label>
              <input type="text" id="customer-name" placeholder="John Smith" required>
            </div>
            <div class="form-group">
              <label for="customer-email">Email</label>
              <input type="email" id="customer-email" placeholder="john@example.com" required>
            </div>
            <div class="form-row">
              <button type="submit" class="btn-primary">Send</button>
              <button type="button" class="btn-secondary" id="cancel-request">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
